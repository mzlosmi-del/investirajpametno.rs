<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Hitna rezerva — dve faze: početni jastuk pa puna rezerva od 3 do 6 meseci troškova">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b71a"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 100 H800"/><path d="M0 250 H800"/><path d="M0 380 H800"/>
  </g>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Hitna rezerva — u dve faze
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    zid između jednog lošeg dana i finansijske katastrofe
  </text>

  <!-- Phase 1 -->
  <g>
    <rect x="60" y="130" width="280" height="220" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="96" cy="168" r="18" fill="#1db58a"/>
    <text x="96" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">1</text>
    <text x="126" y="174" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Početni jastuk</text>
    <text x="84" y="240" font-family="Inter, sans-serif" font-size="34" font-weight="700" fill="#25d49f">~1.000 €</text>
    <text x="84" y="280" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">pre nego što napadneš dugove</text>
    <text x="84" y="304" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">pokriva „male katastrofe"</text>
    <text x="84" y="330" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">bojler, auto, neočekivan račun</text>
  </g>
  <line x1="346" y1="240" x2="384" y2="240" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Phase 2 -->
  <g>
    <rect x="390" y="130" width="350" height="220" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <circle cx="426" cy="168" r="18" fill="#e8b71a"/>
    <text x="426" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">2</text>
    <text x="456" y="174" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Puna rezerva</text>
    <text x="414" y="240" font-family="Inter, sans-serif" font-size="30" font-weight="700" fill="#e8b71a">3–6 meseci</text>
    <text x="414" y="268" font-family="Inter, sans-serif" font-size="14" fill="#cdd8e8">tvojih mesečnih troškova</text>
    <text x="414" y="300" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">štiti od velikih udara:</text>
    <text x="414" y="322" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">gubitak posla, duža bolest</text>
    <text x="660" y="240" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">mesečni</text>
    <text x="660" y="256" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">trošak ×</text>
    <text x="660" y="272" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">3 do 6</text>
  </g>

  <text x="400" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Drži je dostupno, sigurno i u evrima — na običnom štednom računu, ne u akcijama.
  </text>
</svg>
