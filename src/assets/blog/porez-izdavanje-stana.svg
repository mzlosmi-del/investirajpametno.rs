<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Porez na izdavanje stana: od kirije se oduzima 25 odsto normiranih troškova, na ostatak se plaća 20 odsto poreza, što daje efektivnih 15 odsto kirije.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2444"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <path d="M0 92 H800" stroke="#143058" stroke-width="1" opacity="0.45"/>
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Porez na izdavanje stana — kako se računa</text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Stopa je 20%, ali tek posle priznatih troškova.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="112" width="210" height="150" rx="12" fill="#0f2742" stroke="#5a7596" stroke-width="2"/>
    <text x="62" y="144" font-size="13" font-weight="700" fill="#c2d2e6">KIRIJA</text>
    <text x="62" y="182" font-size="22" font-weight="800" fill="#ffffff">100%</text>
    <text x="62" y="214" font-size="13" fill="#9fb3cc">Ugovorena mesečna</text>
    <text x="62" y="232" font-size="13" fill="#9fb3cc">zakupnina.</text>
    <text x="260" y="195" font-size="24" fill="#5a7596">−25%</text>
    <rect x="330" y="112" width="210" height="150" rx="12" fill="#0f2742" stroke="#e8b04b" stroke-width="2"/>
    <text x="352" y="144" font-size="13" font-weight="700" fill="#e8b04b">OSNOVICA</text>
    <text x="352" y="182" font-size="22" font-weight="800" fill="#ffffff">75%</text>
    <text x="352" y="214" font-size="13" fill="#9fb3cc">Posle 25% normiranih</text>
    <text x="352" y="232" font-size="13" fill="#9fb3cc">troškova.</text>
    <text x="550" y="195" font-size="24" fill="#5a7596">×20%</text>
    <rect x="620" y="112" width="140" height="150" rx="12" fill="#13314f" stroke="#25d49f" stroke-width="2"/>
    <text x="642" y="144" font-size="13" font-weight="700" fill="#25d49f">POREZ</text>
    <text x="642" y="182" font-size="22" font-weight="800" fill="#ffffff">≈15%</text>
    <text x="642" y="214" font-size="13" fill="#9fb3cc">efektivno od</text>
    <text x="642" y="232" font-size="13" fill="#9fb3cc">kirije.</text>
  </g>
  <text x="40" y="306" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#9fb3cc">Prijava Poreskoj upravi u roku od 30 dana od davanja stana u zakup (samooporezivanje).</text>
</svg>
