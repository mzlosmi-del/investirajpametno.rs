<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Gde uložiti 1.000 evra — redosled: skupi dugovi, rezerva, pa ulaganje">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b71a"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 100 H800"/><path d="M0 250 H800"/><path d="M0 380 H800"/>
  </g>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Gde uložiti 1.000 evra — redosled
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    redosled je važniji od izbora — radi korake odozdo nagore
  </text>

  <!-- Step 1: debts -->
  <g>
    <rect x="60" y="130" width="200" height="220" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <circle cx="94" cy="168" r="18" fill="#e8b71a"/>
    <text x="94" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">1</text>
    <text x="124" y="174" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Skupi dugovi</text>
    <text x="80" y="216" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">kartice, keš krediti,</text>
    <text x="80" y="238" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">dozvoljeni minus</text>
    <text x="80" y="292" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#e8b71a">15% kamate</text>
    <text x="80" y="318" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">= zagarantovan „prinos"</text>
    <text x="80" y="336" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">bez rizika</text>
  </g>
  <line x1="266" y1="240" x2="300" y2="240" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2: reserve -->
  <g>
    <rect x="306" y="130" width="190" height="220" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="340" cy="168" r="18" fill="#1db58a"/>
    <text x="340" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">2</text>
    <text x="370" y="174" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Rezerva</text>
    <text x="326" y="216" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">početni jastuk</text>
    <text x="326" y="270" font-family="Inter, sans-serif" font-size="22" font-weight="700" fill="#25d49f">~1.000 €</text>
    <text x="326" y="298" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">dostupno i sigurno,</text>
    <text x="326" y="316" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">u evrima — ne ulažeš ga</text>
  </g>
  <line x1="502" y1="240" x2="536" y2="240" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3: invest -->
  <g>
    <rect x="542" y="130" width="210" height="220" rx="14" fill="#0e2a4c" stroke="#25d49f" stroke-width="1.5"/>
    <circle cx="576" cy="168" r="18" fill="#25d49f"/>
    <text x="576" y="174" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">3</text>
    <text x="606" y="174" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Uloži</text>
    <text x="562" y="214" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">regulisan broker</text>
    <text x="562" y="238" font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">širok indeksni ETF</text>
    <path d="M566 314 L600 286 L624 300 L660 262" fill="none" stroke="#25d49f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="660" cy="262" r="4" fill="#25d49f"/>
    <text x="562" y="336" font-family="Inter, sans-serif" font-size="12" fill="#8fa3c1">pa dodaj svaki mesec</text>
  </g>

  <text x="400" y="424" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Sa 1.000 € ne bogatiš se — gradiš naviku koja te dugoročno bogati.
  </text>
</svg>
