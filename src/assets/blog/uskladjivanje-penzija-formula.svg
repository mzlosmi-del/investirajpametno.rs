<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Švajcarska formula za usklađivanje penzija u Srbiji: ako je masa penzija ispod 10 odsto BDP-a penzije se usklađuju sa rastom prosečne zarade; između 10 i 10,5 odsto pola sa inflacijom pola sa zaradama; preko 10,5 odsto samo sa inflacijom.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 92 H800"/>
  </g>

  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Švajcarska formula — kako se bira usklađivanje</text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Pravilo zavisi od učešća mase penzija u BDP-u.</text>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- Card 1: < 10% -->
    <rect x="40" y="110" width="230" height="300" rx="12" fill="#0f2742" stroke="#25d49f" stroke-width="2"/>
    <text x="62" y="146" font-size="13" font-weight="700" letter-spacing="1.2" fill="#25d49f">DO 10% BDP-a</text>
    <text x="62" y="196" font-size="30" font-weight="800" fill="#ffffff">100%</text>
    <text x="62" y="226" font-size="15" fill="#ffffff">rast prosečne</text>
    <text x="62" y="248" font-size="15" fill="#ffffff">zarade</text>
    <text x="62" y="300" font-size="13" fill="#9fb3cc">Najpovoljnije za</text>
    <text x="62" y="320" font-size="13" fill="#9fb3cc">penzionere — plate</text>
    <text x="62" y="340" font-size="13" fill="#9fb3cc">obično rastu brže</text>
    <text x="62" y="360" font-size="13" fill="#9fb3cc">od cena.</text>

    <!-- Card 2: 10-10,5% -->
    <rect x="285" y="110" width="230" height="300" rx="12" fill="#0f2742" stroke="#e8b04b" stroke-width="2"/>
    <text x="307" y="146" font-size="13" font-weight="700" letter-spacing="1.2" fill="#e8b04b">10 – 10,5% BDP-a</text>
    <text x="307" y="196" font-size="30" font-weight="800" fill="#ffffff">50/50</text>
    <text x="307" y="226" font-size="15" fill="#ffffff">pola inflacija,</text>
    <text x="307" y="248" font-size="15" fill="#ffffff">pola zarade</text>
    <text x="307" y="300" font-size="13" fill="#9fb3cc">Prava „švajcarska</text>
    <text x="307" y="320" font-size="13" fill="#9fb3cc">formula" — čuva</text>
    <text x="307" y="340" font-size="13" fill="#9fb3cc">kupovnu moć.</text>

    <!-- Card 3: > 10,5% -->
    <rect x="530" y="110" width="230" height="300" rx="12" fill="#0f2742" stroke="#5a7596" stroke-width="2"/>
    <text x="552" y="146" font-size="13" font-weight="700" letter-spacing="1.2" fill="#c2d2e6">PREKO 10,5% BDP-a</text>
    <text x="552" y="196" font-size="30" font-weight="800" fill="#ffffff">100%</text>
    <text x="552" y="226" font-size="15" fill="#ffffff">inflacija</text>
    <text x="552" y="248" font-size="15" fill="#ffffff">(potrošačke cene)</text>
    <text x="552" y="300" font-size="13" fill="#9fb3cc">Najstrože — samo</text>
    <text x="552" y="320" font-size="13" fill="#9fb3cc">prati cene, ne i</text>
    <text x="552" y="340" font-size="13" fill="#9fb3cc">rast standarda.</text>
  </g>

  <text x="40" y="448" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#6f83a0">Usklađivanje je jednom godišnje. Tačan procenat objavljuje Republički fond PIO.</text>
</svg>
