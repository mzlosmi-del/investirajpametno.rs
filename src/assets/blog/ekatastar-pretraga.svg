<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" role="img" aria-label="eKatastar pretraga — tok od adrese do lista nepokretnosti">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b71a"/>
    </marker>
    <filter id="soft" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <rect width="800" height="460" fill="url(#bg)"/>

  <!-- subtle grid -->
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 90 H800"/><path d="M0 230 H800"/><path d="M0 370 H800"/>
  </g>

  <!-- Title -->
  <text x="40" y="50" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    eKatastar pretraga — kako stići do lista nepokretnosti
  </text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    Javni pristup · besplatno · bez registracije
  </text>

  <!-- Step 1 box -->
  <g>
    <rect x="40" y="120" width="200" height="220" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="74" cy="158" r="18" fill="#1db58a"/>
    <text x="74" y="164" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">1</text>
    <text x="104" y="164" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Adresa</text>

    <rect x="60" y="195" width="160" height="36" rx="8" fill="#f7f9fc" stroke="#cfd9e6"/>
    <text x="72" y="218" font-family="ui-monospace, monospace" font-size="13" fill="#3a4658">opština</text>

    <rect x="60" y="241" width="160" height="36" rx="8" fill="#f7f9fc" stroke="#cfd9e6"/>
    <text x="72" y="264" font-family="ui-monospace, monospace" font-size="13" fill="#3a4658">ulica + br.</text>

    <rect x="60" y="293" width="160" height="34" rx="8" fill="#e8b71a"/>
    <text x="140" y="316" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#081a2e">Pretraži</text>
  </g>

  <!-- Arrow 1 -->
  <line x1="250" y1="230" x2="295" y2="230" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 box -->
  <g>
    <rect x="300" y="120" width="200" height="220" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="334" cy="158" r="18" fill="#1db58a"/>
    <text x="334" y="164" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">2</text>
    <text x="364" y="164" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">Objekat</text>

    <g font-family="Inter, sans-serif" font-size="12" fill="#cdd8e8">
      <rect x="320" y="190" width="160" height="34" rx="6" fill="#143058"/>
      <text x="332" y="211">▸ Stan 12, sprat 4</text>
      <rect x="320" y="232" width="160" height="34" rx="6" fill="#143058"/>
      <text x="332" y="253">▸ Stan 7, sprat 2</text>
      <rect x="320" y="274" width="160" height="34" rx="6" fill="#1db58a"/>
      <text x="332" y="295" fill="#081a2e" font-weight="700">▸ Stan 5, sprat 1</text>
    </g>
  </g>

  <!-- Arrow 2 -->
  <line x1="510" y1="230" x2="555" y2="230" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 box (List nepokretnosti) -->
  <g>
    <rect x="560" y="120" width="200" height="220" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <circle cx="594" cy="158" r="18" fill="#e8b71a"/>
    <text x="594" y="164" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#081a2e">3</text>
    <text x="624" y="164" font-family="Inter, sans-serif" font-size="15" font-weight="600" fill="#ffffff">List nepokretnosti</text>

    <g font-family="Inter, sans-serif" font-size="11">
      <text x="580" y="195" fill="#8fa3c1" font-weight="600">VLASNIK</text>
      <text x="580" y="212" fill="#ffffff">M. Petrović · 100%</text>

      <text x="580" y="238" fill="#8fa3c1" font-weight="600">POVRŠINA</text>
      <text x="580" y="255" fill="#ffffff">52 m²</text>

      <text x="580" y="281" fill="#8fa3c1" font-weight="600">TERETI / HIPOTEKE</text>
      <text x="580" y="298" fill="#1db58a" font-weight="700">nema upisa</text>
    </g>
  </g>

  <!-- Bottom hint -->
  <text x="400" y="410" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#a6b6cc">
    katastar.rgz.gov.rs/eKatastarPublic/
  </text>
  <text x="400" y="430" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#6e85a8">
    Cela operacija traje pod 2 minuta
  </text>
</svg>
