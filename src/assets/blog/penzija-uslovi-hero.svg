<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Uslovi za penziju u Srbiji 2026 — godine života i staž za žene i muškarce.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <radialGradient id="coin" cx="35%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#f5d65b"/>
      <stop offset="100%" stop-color="#e8b71a"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.4">
    <path d="M0 170 H1200"/><path d="M0 340 H1200"/><path d="M0 510 H1200"/>
  </g>
  <circle cx="1040" cy="170" r="280" fill="#15407a" opacity="0.12"/>

  <text x="80" y="216" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="700" letter-spacing="3" fill="#25d49f">PENZIJE · INVESTIRAJ PAMETNO</text>

  <text x="78" y="304" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" fill="#ffffff">Uslovi za penziju</text>
  <text x="78" y="376" font-family="Inter, system-ui, sans-serif" font-size="62" font-weight="800" fill="#ffffff">u Srbiji 2026</text>

  <text x="80" y="442" font-family="Inter, system-ui, sans-serif" font-size="26" fill="#a6b6cc">Godine života i staž — za žene i muškarce, korak po korak.</text>

  <!-- conditions chips -->
  <g font-family="Inter, system-ui, sans-serif">
    <circle cx="812" cy="250" r="46" fill="#0f2742" stroke="#25d49f" stroke-width="4"/>
    <text x="812" y="260" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">65</text>
    <text x="878" y="244" font-size="26" font-weight="700" fill="#ffffff">Muškarci</text>
    <text x="878" y="272" font-size="18" fill="#9fb3cc">+ najmanje 15 god. staža</text>

    <circle cx="812" cy="372" r="46" fill="#0f2742" stroke="#1db58a" stroke-width="4"/>
    <text x="812" y="382" text-anchor="middle" font-size="30" font-weight="800" fill="#ffffff">64</text>
    <text x="878" y="366" font-size="26" font-weight="700" fill="#ffffff">Žene (2026)</text>
    <text x="878" y="394" font-size="18" fill="#9fb3cc">+ najmanje 15 god. staža</text>

    <circle cx="812" cy="494" r="46" fill="url(#coin)"/>
    <text x="812" y="504" text-anchor="middle" font-size="30" font-weight="800" fill="#3a2e00">45</text>
    <text x="878" y="488" font-size="26" font-weight="700" fill="#ffffff">Pun staž</text>
    <text x="878" y="516" font-size="18" fill="#9fb3cc">bez obzira na godine života</text>
  </g>
</svg>
