<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" role="img" aria-label="Šta ulazi u penzijski staž: rad uz uplaćene doprinose, bolovanje, porodiljsko, dokupljeni i beneficirani staž. Ne ulazi rad na crno bez doprinosa.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2444"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="800" height="340" fill="url(#bg)"/>
  <path d="M0 92 H800" stroke="#143058" stroke-width="1" opacity="0.45"/>
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Penzijski staž — šta se računa</text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Staž postoji samo tamo gde su uplaćeni doprinosi.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="112" width="350" height="200" rx="12" fill="#0f2742" stroke="#25d49f" stroke-width="2"/>
    <text x="64" y="146" font-size="13" font-weight="700" letter-spacing="1.2" fill="#25d49f">ULAZI U STAŽ</text>
    <text x="64" y="180" font-size="15" fill="#ffffff">✓ Rad uz uplaćene doprinose</text>
    <text x="64" y="208" font-size="15" fill="#ffffff">✓ Bolovanje i porodiljsko</text>
    <text x="64" y="236" font-size="15" fill="#ffffff">✓ Dokupljeni (kupljeni) staž</text>
    <text x="64" y="264" font-size="15" fill="#ffffff">✓ Beneficirani staž (uvećan)</text>
    <text x="64" y="292" font-size="13" fill="#9fb3cc">Vreme osiguranja, ne samo rad.</text>
    <rect x="410" y="112" width="350" height="200" rx="12" fill="#0f2742" stroke="#c9603f" stroke-width="2"/>
    <text x="434" y="146" font-size="13" font-weight="700" letter-spacing="1.2" fill="#e08a6c">NE ULAZI</text>
    <text x="434" y="180" font-size="15" fill="#ffffff">✗ Rad na crno (bez doprinosa)</text>
    <text x="434" y="208" font-size="15" fill="#ffffff">✗ Neprijavljeni periodi</text>
    <text x="434" y="236" font-size="15" fill="#ffffff">✗ Neuplaćeni doprinosi</text>
    <text x="434" y="278" font-size="13" fill="#9fb3cc">Te godine ne postoje u</text>
    <text x="434" y="296" font-size="13" fill="#9fb3cc">tvojoj penzijskoj evidenciji.</text>
  </g>
</svg>
