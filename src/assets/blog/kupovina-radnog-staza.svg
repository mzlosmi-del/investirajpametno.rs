<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" role="img" aria-label="Cena kupovine radnog staža: izabrana osnovica pomnožena stopom PIO doprinosa od 24 odsto i brojem meseci koji se dokupljuju.">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2444"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="800" height="320" fill="url(#bg)"/>
  <path d="M0 92 H800" stroke="#143058" stroke-width="1" opacity="0.45"/>
  <text x="40" y="48" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Kupovina staža — kako se računa cena</text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Sam plaćaš PIO doprinos za period koji ti nedostaje.</text>
  <g font-family="Inter, system-ui, sans-serif">
    <rect x="40" y="120" width="720" height="80" rx="12" fill="#0f2742" stroke="#e8b04b" stroke-width="2"/>
    <text x="400" y="168" font-size="22" font-weight="800" fill="#ffffff" text-anchor="middle">Cena = osnovica × 24% (PIO) × broj meseci</text>
    <rect x="40" y="220" width="350" height="74" rx="10" fill="#0f2742" stroke="#143058"/>
    <text x="64" y="250" font-size="13" font-weight="700" fill="#25d49f">OSNOVICU BIRAŠ</text>
    <text x="64" y="278" font-size="14" fill="#9fb3cc">između propisanog minimuma i maksimuma.</text>
    <rect x="410" y="220" width="350" height="74" rx="10" fill="#0f2742" stroke="#143058"/>
    <text x="434" y="250" font-size="13" font-weight="700" fill="#25d49f">PLAĆA SE</text>
    <text x="434" y="278" font-size="14" fill="#9fb3cc">odjednom ili na rate, preko Fonda PIO.</text>
  </g>
</svg>
