<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Realna računica zarade od klikova na PTC sajtovima: sat vremena klikanja vredi manje od evra">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2444"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="800" height="470" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Koliko stvarno donese „zarada od klikova"</text>
  <text x="40" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#a6b6cc">tipičan PTC sajt: par stotinki po reklami, par desetina reklama dnevno</text>
  <g font-family="Inter, Arial, sans-serif">
    <rect x="60" y="110" width="680" height="70" rx="12" fill="#0e2a4c" stroke="#1f3a5f"/>
    <text x="80" y="142" font-size="15" fill="#a6b6cc">1 klik na reklamu</text>
    <text x="720" y="152" text-anchor="end" font-size="26" font-weight="800" fill="#e8b71a">≈ 0,005 €</text>

    <rect x="60" y="195" width="680" height="70" rx="12" fill="#0e2a4c" stroke="#1f3a5f"/>
    <text x="80" y="227" font-size="15" fill="#a6b6cc">1 sat klikanja (≈ 40 reklama)</text>
    <text x="720" y="237" text-anchor="end" font-size="26" font-weight="800" fill="#e8b71a">≈ 0,20 €</text>

    <rect x="60" y="280" width="680" height="70" rx="12" fill="#0e2a4c" stroke="#1f3a5f"/>
    <text x="80" y="312" font-size="15" fill="#a6b6cc">mesec dana po sat dnevno</text>
    <text x="720" y="322" text-anchor="end" font-size="26" font-weight="800" fill="#e8b71a">≈ 6 €</text>

    <rect x="60" y="370" width="680" height="64" rx="12" fill="#06251c" stroke="#25d49f" stroke-width="2"/>
    <text x="80" y="408" font-size="15" fill="#4fe0b0">isto vreme uloženo u veštinu/sadržaj</text>
    <text x="720" y="412" text-anchor="end" font-size="20" font-weight="800" fill="#4fe0b0">neuporedivo više</text>
  </g>
</svg>
