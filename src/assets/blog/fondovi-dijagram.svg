<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Investicioni fond vs ETF — kako visoka provizija kroz godine odgrize prinos">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Fond vs ETF: tihi jedač prinosa
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    iste akcije unutra — različit trošak — bitno različit ishod kroz godine
  </text>

  <!-- Chart area -->
  <g>
    <!-- axes -->
    <line x1="90" y1="120" x2="90" y2="380" stroke="#2a4a72" stroke-width="2"/>
    <line x1="90" y1="380" x2="740" y2="380" stroke="#2a4a72" stroke-width="2"/>
    <text x="70" y="130" text-anchor="end" font-family="Inter, sans-serif" font-size="11" fill="#8fa3c1">€</text>
    <text x="92" y="398" font-family="Inter, sans-serif" font-size="11" fill="#8fa3c1">danas</text>
    <text x="700" y="398" font-family="Inter, sans-serif" font-size="11" fill="#8fa3c1">30 god.</text>

    <!-- ETF curve (low fee) -->
    <path d="M90 372 C 280 360, 470 250, 720 140" fill="none" stroke="#25d49f" stroke-width="4" stroke-linecap="round"/>
    <circle cx="720" cy="140" r="5" fill="#25d49f"/>
    <text x="600" y="170" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#25d49f">ETF · ~0,2%</text>

    <!-- Fund curve (high fee) -->
    <path d="M90 372 C 280 366, 470 320, 720 250" fill="none" stroke="#e8b71a" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 0"/>
    <circle cx="720" cy="250" r="5" fill="#e8b71a"/>
    <text x="560" y="300" font-family="Inter, sans-serif" font-size="14" font-weight="700" fill="#e8b71a">aktivni fond · ~2%</text>

    <!-- gap bracket -->
    <line x1="720" y1="148" x2="720" y2="242" stroke="#ff7a7a" stroke-width="1.5" stroke-dasharray="4 3"/>
    <text x="734" y="200" font-family="Inter, sans-serif" font-size="12" fill="#ff9b9b">razlika</text>
    <text x="734" y="216" font-family="Inter, sans-serif" font-size="12" fill="#ff9b9b">koju pojede</text>
    <text x="734" y="232" font-family="Inter, sans-serif" font-size="12" fill="#ff9b9b">provizija</text>
  </g>

  <text x="400" y="430" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Ilustracija principa, ne stvarni prinos. Pre ulaganja pitaj: kolika je godišnja provizija?
  </text>
</svg>
