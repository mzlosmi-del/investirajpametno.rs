<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Kako kupiti akcije iz Srbije — tok od brokera do kupovine ETF-a">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e8b71a"/>
    </marker>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 95 H800"/><path d="M0 235 H800"/><path d="M0 375 H800"/>
  </g>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Kako kupiti akcije iz Srbije — 4 koraka
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    regulisan broker · lična karta · bankovni račun · strpljenje
  </text>

  <!-- Step 1 -->
  <g>
    <rect x="36" y="120" width="172" height="230" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="68" cy="156" r="17" fill="#1db58a"/>
    <text x="68" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#081a2e">1</text>
    <text x="96" y="162" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Broker</text>
    <g font-family="Inter, sans-serif" font-size="12" fill="#cdd8e8">
      <circle cx="58" cy="200" r="3" fill="#1db58a"/><text x="70" y="204">niske provizije</text>
      <circle cx="58" cy="228" r="3" fill="#1db58a"/><text x="70" y="232">regulisan</text>
      <circle cx="58" cy="256" r="3" fill="#1db58a"/><text x="70" y="260">pristup berzama</text>
      <circle cx="58" cy="284" r="3" fill="#1db58a"/><text x="70" y="288">lak za korišćenje</text>
    </g>
    <text x="52" y="328" font-family="Inter, sans-serif" font-size="11.5" fill="#8fa3c1">sigurnost &gt; pola evra</text>
  </g>
  <line x1="214" y1="235" x2="248" y2="235" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 2 -->
  <g>
    <rect x="252" y="120" width="150" height="230" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="284" cy="156" r="17" fill="#1db58a"/>
    <text x="284" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#081a2e">2</text>
    <text x="312" y="162" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Nalog</text>
    <g font-family="Inter, sans-serif" font-size="12" fill="#cdd8e8">
      <circle cx="272" cy="200" r="3" fill="#1db58a"/><text x="284" y="204">lična karta</text>
      <circle cx="272" cy="228" r="3" fill="#1db58a"/><text x="284" y="232">dokaz adrese</text>
      <circle cx="272" cy="256" r="3" fill="#1db58a"/><text x="284" y="260">verifikacija (KYC)</text>
    </g>
    <text x="268" y="320" font-family="Inter, sans-serif" font-size="11.5" fill="#8fa3c1">potpuno onlajn</text>
  </g>
  <line x1="408" y1="235" x2="442" y2="235" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 3 -->
  <g>
    <rect x="446" y="120" width="150" height="230" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <circle cx="478" cy="156" r="17" fill="#1db58a"/>
    <text x="478" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#081a2e">3</text>
    <text x="506" y="162" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Uplata</text>
    <rect x="466" y="192" width="112" height="32" rx="8" fill="#13335c" stroke="#1d4575"/>
    <text x="476" y="213" font-family="Inter, sans-serif" font-size="12" fill="#cdd8e8">bankovni transfer</text>
    <rect x="466" y="232" width="112" height="32" rx="8" fill="#13335c" stroke="#1d4575"/>
    <text x="476" y="253" font-family="Inter, sans-serif" font-size="12" fill="#cdd8e8">RSD → EUR/USD</text>
    <text x="462" y="320" font-family="Inter, sans-serif" font-size="11.5" fill="#8fa3c1">proveri konverziju</text>
  </g>
  <line x1="602" y1="235" x2="636" y2="235" stroke="#e8b71a" stroke-width="2.5" marker-end="url(#arrow)"/>

  <!-- Step 4 -->
  <g>
    <rect x="640" y="120" width="124" height="230" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <circle cx="672" cy="156" r="17" fill="#e8b71a"/>
    <text x="672" y="162" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#081a2e">4</text>
    <text x="700" y="162" font-family="Inter, sans-serif" font-size="14" font-weight="600" fill="#ffffff">Kupi</text>
    <text x="702" y="200" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="700" fill="#25d49f">ETF</text>
    <text x="702" y="222" text-anchor="middle" font-family="Inter, sans-serif" font-size="10.5" fill="#a6b6cc">celo tržište</text>
    <path d="M656 300 L676 278 L692 290 L712 262" fill="none" stroke="#25d49f" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="712" cy="262" r="4" fill="#25d49f"/>
    <text x="652" y="328" font-family="Inter, sans-serif" font-size="11.5" fill="#8fa3c1">pa dodaj redovno</text>
  </g>

  <text x="400" y="432" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Ne kupuj pojedinačne akcije dok ne naučiš — počni od širokog ETF-a.
  </text>
</svg>
