<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Diversifikacija — sve na jednu kartu protiv rizika razbacanog kroz mnogo firmi">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Diversifikacija: jedna korpa vs mnogo korpi
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    ne stavljaš sva jaja u jednu korpu
  </text>

  <!-- Left: one basket (risky) -->
  <g>
    <rect x="40" y="110" width="330" height="300" rx="14" fill="#0e2a4c" stroke="#ff7a7a" stroke-width="1.5"/>
    <text x="205" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ff9b9b">SVE NA JEDNU KARTU</text>
    <circle cx="205" cy="250" r="78" fill="#13335c" stroke="#ff7a7a" stroke-width="2"/>
    <text x="205" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#ffffff">1 firma</text>
    <text x="205" y="268" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" fill="#a6b6cc">100% kapitala</text>
    <text x="205" y="372" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#ff9b9b">propadne firma → propadneš ti</text>
  </g>

  <!-- Right: many baskets (safe) -->
  <g>
    <rect x="430" y="110" width="330" height="300" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <text x="595" y="142" text-anchor="middle" font-family="Inter, sans-serif" font-size="15" font-weight="700" fill="#25d49f">RAZBACANO (ETF)</text>
    <g fill="#13335c" stroke="#1db58a" stroke-width="1.5">
      <circle cx="492" cy="190" r="20"/><circle cx="548" cy="190" r="20"/><circle cx="604" cy="190" r="20"/><circle cx="660" cy="190" r="20"/><circle cx="716" cy="190" r="20"/>
      <circle cx="492" cy="246" r="20"/><circle cx="548" cy="246" r="20"/><circle cx="604" cy="246" r="20"/><circle cx="660" cy="246" r="20"/><circle cx="716" cy="246" r="20"/>
      <circle cx="492" cy="302" r="20"/><circle cx="548" cy="302" r="20"/><circle cx="604" cy="302" r="20"/><circle cx="660" cy="302" r="20"/><circle cx="716" cy="302" r="20"/>
    </g>
    <text x="595" y="372" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" fill="#25d49f">propadne jedna → samo ogrebotina</text>
  </g>

  <text x="400" y="440" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Jedan širok ETF = suvlasništvo u stotinama firmi, jednim potezom.
  </text>
</svg>
