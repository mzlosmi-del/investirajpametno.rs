<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Mapa opcija za ulaganje novca u Srbiji prema roku i riziku: štednja, obveznice, ETF, nekretnine">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#0c2444"/><stop offset="100%" stop-color="#081a2e"/></linearGradient></defs>
  <rect width="800" height="470" fill="url(#bg)"/>
  <text x="40" y="44" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#fff">Gde uložiti novac — prema roku i riziku</text>
  <text x="40" y="66" font-family="Inter, Arial, sans-serif" font-size="13" fill="#a6b6cc">što ti je novac duže slobodan, više rizika (i potencijalnog prinosa) možeš da nosiš</text>
  <!-- axes -->
  <line x1="90" y1="410" x2="760" y2="410" stroke="#1f3a5f" stroke-width="2"/>
  <line x1="90" y1="110" x2="90" y2="410" stroke="#1f3a5f" stroke-width="2"/>
  <text x="84" y="105" text-anchor="end" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9fb3cc" transform="rotate(-90 84 260)">veći rizik / prinos →</text>
  <text x="430" y="438" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="12" fill="#9fb3cc">duži horizont →</text>
  <!-- bubbles -->
  <g font-family="Inter, Arial, sans-serif">
    <circle cx="190" cy="350" r="52" fill="#0e2a4c" stroke="#4fe0b0" stroke-width="2"/>
    <text x="190" y="346" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Štednja</text>
    <text x="190" y="366" text-anchor="middle" font-size="11" fill="#a6b6cc">kratak rok</text>

    <circle cx="330" cy="300" r="50" fill="#0e2a4c" stroke="#e8b71a" stroke-width="2"/>
    <text x="330" y="296" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Obveznice</text>
    <text x="330" y="316" text-anchor="middle" font-size="11" fill="#a6b6cc">srednji rok</text>

    <circle cx="560" cy="190" r="62" fill="#0e2a4c" stroke="#25d49f" stroke-width="2.5"/>
    <text x="560" y="184" text-anchor="middle" font-size="16" font-weight="700" fill="#fff">ETF / akcije</text>
    <text x="560" y="204" text-anchor="middle" font-size="11" fill="#a6b6cc">dug rok (5+ god.)</text>

    <circle cx="650" cy="320" r="56" fill="#0e2a4c" stroke="#9fb3cc" stroke-width="2"/>
    <text x="650" y="314" text-anchor="middle" font-size="15" font-weight="700" fill="#fff">Nekretnine</text>
    <text x="650" y="334" text-anchor="middle" font-size="11" fill="#a6b6cc">dug rok, veliki ulog</text>
  </g>
</svg>
