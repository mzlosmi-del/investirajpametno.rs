<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Poređenje: štednja, akcije i nekretnine po prinosu, riziku, likvidnosti i ulaznom pragu">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>

  <text x="40" y="50" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Štednja vs Akcije vs Nekretnine
  </text>
  <text x="40" y="72" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    svaka opcija rešava drugi problem — pa se kombinuju
  </text>

  <!-- Three columns -->
  <!-- Stednja -->
  <g>
    <rect x="40" y="96" width="232" height="300" rx="14" fill="#0e2a4c" stroke="#25d49f" stroke-width="1.5"/>
    <text x="156" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#25d49f">Štednja</text>
    <g font-family="Inter, sans-serif" font-size="12.5" fill="#cdd8e8">
      <text x="60" y="166">Prinos:</text><text x="260" y="166" text-anchor="end" fill="#8fa3c1">nizak</text>
      <text x="60" y="200">Rizik:</text><text x="260" y="200" text-anchor="end" fill="#25d49f">vrlo nizak</text>
      <text x="60" y="234">Likvidnost:</text><text x="260" y="234" text-anchor="end" fill="#25d49f">odmah</text>
      <text x="60" y="268">Ulaz:</text><text x="260" y="268" text-anchor="end" fill="#25d49f">bilo koji</text>
    </g>
    <text x="60" y="330" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Uloga:</text>
    <text x="60" y="352" font-family="Inter, sans-serif" font-size="12.5" fill="#a6b6cc">sigurnost, rezerva</text>
  </g>

  <!-- Akcije -->
  <g>
    <rect x="284" y="96" width="232" height="300" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <text x="400" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#1db58a">Akcije / ETF</text>
    <g font-family="Inter, sans-serif" font-size="12.5" fill="#cdd8e8">
      <text x="304" y="166">Prinos:</text><text x="504" y="166" text-anchor="end" fill="#25d49f">najviši</text>
      <text x="304" y="200">Rizik:</text><text x="504" y="200" text-anchor="end" fill="#e8b71a">kolebanje</text>
      <text x="304" y="234">Likvidnost:</text><text x="504" y="234" text-anchor="end" fill="#25d49f">par dana</text>
      <text x="304" y="268">Ulaz:</text><text x="504" y="268" text-anchor="end" fill="#25d49f">od par stotina €</text>
    </g>
    <text x="304" y="330" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Uloga:</text>
    <text x="304" y="352" font-family="Inter, sans-serif" font-size="12.5" fill="#a6b6cc">dugoročni rast</text>
  </g>

  <!-- Nekretnine -->
  <g>
    <rect x="528" y="96" width="232" height="300" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <text x="644" y="128" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#e8b71a">Nekretnine</text>
    <g font-family="Inter, sans-serif" font-size="12.5" fill="#cdd8e8">
      <text x="548" y="166">Prinos:</text><text x="748" y="166" text-anchor="end" fill="#cdd8e8">umeren + izdavanje</text>
      <text x="548" y="200">Rizik:</text><text x="748" y="200" text-anchor="end" fill="#e8b71a">umeren</text>
      <text x="548" y="234">Likvidnost:</text><text x="748" y="234" text-anchor="end" fill="#ff9b9b">niska</text>
      <text x="548" y="268">Ulaz:</text><text x="748" y="268" text-anchor="end" fill="#ff9b9b">velik kapital</text>
    </g>
    <text x="548" y="330" font-family="Inter, sans-serif" font-size="12.5" font-weight="600" fill="#ffffff">Uloga:</text>
    <text x="548" y="352" font-family="Inter, sans-serif" font-size="12.5" fill="#a6b6cc">opipljiva imovina, prihod</text>
  </g>

  <text x="400" y="436" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Ne biraš jedno — kombinuješ: prvo štednja, pa akcije, pa nekretnine kad skupiš kapital.
  </text>
</svg>
