<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 470" role="img" aria-label="Pravilo 50/30/20 — raspodela neto plate na potrebe, želje i štednju">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="470" fill="url(#bg)"/>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">
    Pravilo 50/30/20
  </text>
  <text x="40" y="74" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">
    kako da rasporediš neto platu — okvir, ne sveto pismo
  </text>

  <!-- Bar -->
  <g>
    <rect x="40" y="110" width="360" height="48" rx="10" fill="#1db58a"/>
    <rect x="400" y="110" width="216" height="48" fill="#e8b71a"/>
    <rect x="616" y="110" width="144" height="48" rx="0" fill="#25d49f"/>
    <rect x="752" y="110" width="8" height="48" rx="4" fill="#25d49f"/>
    <text x="220" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#06243f">50%</text>
    <text x="508" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#06243f">30%</text>
    <text x="688" y="140" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#06243f">20%</text>
  </g>

  <!-- Three cards -->
  <g>
    <rect x="40" y="190" width="230" height="200" rx="14" fill="#0e2a4c" stroke="#1db58a" stroke-width="1.5"/>
    <rect x="58" y="210" width="40" height="8" rx="4" fill="#1db58a"/>
    <text x="58" y="248" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Potrebe — 50%</text>
    <g font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">
      <text x="58" y="282">stan / kirija / rata</text>
      <text x="58" y="308">režije i prevoz</text>
      <text x="58" y="334">hrana</text>
      <text x="58" y="360">obavezni računi</text>
    </g>
  </g>

  <g>
    <rect x="286" y="190" width="226" height="200" rx="14" fill="#0e2a4c" stroke="#e8b71a" stroke-width="1.5"/>
    <rect x="304" y="210" width="40" height="8" rx="4" fill="#e8b71a"/>
    <text x="304" y="248" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Želje — 30%</text>
    <g font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">
      <text x="304" y="282">izlasci i dostava</text>
      <text x="304" y="308">hobi i odeća</text>
      <text x="304" y="334">putovanja</text>
      <text x="304" y="360">ono što te raduje</text>
    </g>
  </g>

  <g>
    <rect x="528" y="190" width="232" height="200" rx="14" fill="#0e2a4c" stroke="#25d49f" stroke-width="1.5"/>
    <rect x="546" y="210" width="40" height="8" rx="4" fill="#25d49f"/>
    <text x="546" y="248" font-family="Inter, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Štednja — 20%</text>
    <g font-family="Inter, sans-serif" font-size="13" fill="#cdd8e8">
      <text x="546" y="282">hitna rezerva</text>
      <text x="546" y="308">otplata dugova</text>
      <text x="546" y="334">ulaganje (ETF)</text>
      <text x="546" y="360">plati prvo sebi</text>
    </g>
  </g>

  <text x="400" y="432" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#6e85a8">
    Prilagodi procente svojoj realnosti — ali neka štednja uvek ima svoje mesto.
  </text>
</svg>
