<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 430" role="img" aria-label="Kako se računa porez na kapitalni dobitak: prodajna cena minus nabavna cena, puta 15 posto, jednako porez">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0c2444"/>
      <stop offset="100%" stop-color="#081a2e"/>
    </linearGradient>
  </defs>

  <rect width="800" height="430" fill="url(#bg)"/>
  <g stroke="#143058" stroke-width="1" opacity="0.45">
    <path d="M0 110 H800"/><path d="M0 300 H800"/>
  </g>

  <text x="40" y="52" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700" fill="#ffffff">Kako se računa porez na kapitalni dobitak</text>
  <text x="40" y="76" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Porez se plaća samo na zaradu — razliku prodajne i nabavne cene, ne na ceo iznos.</text>

  <!-- formula boxes -->
  <g font-family="Inter, system-ui, sans-serif">
    <!-- prodajna -->
    <rect x="40" y="150" width="190" height="86" rx="12" fill="#0f2742" stroke="#25d49f" stroke-width="2"/>
    <text x="135" y="186" text-anchor="middle" font-size="15" fill="#9fb3cc">Prodajna cena</text>
    <text x="135" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">150 €</text>

    <text x="250" y="203" text-anchor="middle" font-size="40" font-weight="700" fill="#e8b71a">−</text>

    <!-- nabavna -->
    <rect x="272" y="150" width="190" height="86" rx="12" fill="#0f2742" stroke="#1db58a" stroke-width="2"/>
    <text x="367" y="186" text-anchor="middle" font-size="15" fill="#9fb3cc">Nabavna cena</text>
    <text x="367" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">100 €</text>

    <text x="482" y="203" text-anchor="middle" font-size="34" font-weight="700" fill="#e8b71a">×</text>

    <!-- stopa -->
    <rect x="504" y="150" width="120" height="86" rx="12" fill="#06251c" stroke="#25d49f" stroke-width="2"/>
    <text x="564" y="186" text-anchor="middle" font-size="15" fill="#9fb3cc">Stopa</text>
    <text x="564" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#4fe0b0">15%</text>

    <text x="646" y="203" text-anchor="middle" font-size="34" font-weight="700" fill="#e8b71a">=</text>

    <!-- porez -->
    <rect x="668" y="150" width="92" height="86" rx="12" fill="#e8b71a"/>
    <text x="714" y="186" text-anchor="middle" font-size="14" fill="#3a2e00">Porez</text>
    <text x="714" y="216" text-anchor="middle" font-size="22" font-weight="700" fill="#1a1400">7,5 €</text>
  </g>

  <!-- note line -->
  <text x="40" y="345" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#ffffff">Dobit = 50 €  →  porez = 15% × 50 € = 7,5 €</text>
  <text x="40" y="375" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Devizne iznose preračunaj u dinare po srednjem kursu NBS na dan svake transakcije.</text>
  <text x="40" y="398" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#a6b6cc">Ako prodaš po istoj ili nižoj ceni — nema dobiti, nema poreza.</text>
</svg>
